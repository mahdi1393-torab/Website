{% extends 'base.html' %}
{% block haeder %}
    <title>ویرایش محصول {{ product.id }}</title>
{% endblock %}
{% block body %}

    {% include 'part/header.html' %}


    <section class="simple-box big">

        {% if product.images|length > 0 %}
    {% for image in product.images %}
        <img src="{{ url_for('static', filename='cover/' + image.image) }}"
             style="width:120px;height:120px;object-fit:cover;border-radius:8px;margin:5px;">
    {% endfor %}
{% else %}
    <p>بدون تصویر</p>
{% endif %}
        <form action="#" method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="file" name="cover" multiple>
            <input type="text" name="name" value="{{ product.name }}" placeholder="نام محصول">
            <textarea name="description" placeholder="توضیحات">{{ product.description }}</textarea>
            <input type="number" value="{{ product.price }}" name="price" placeholder="قیمت محصول">
            <div style="display: flex;justify-content: center">
                <label> فعال </label><input style="margin: 5px;width: auto;" value="1" type="checkbox"
                                            name="active" {{ "checked" if product.active == 1 }} >
            </div>

            <input type="submit" value="ثبت تغییرات">
        </form>

    </section>

{% endblock %}
